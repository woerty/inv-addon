# Scanner Configuration
api_url=http://192.168.178.25:8099/api
scanner_token=
input_device=/dev/input/event0
touch_device=/dev/input/event1
fb_device=/dev/fb0
backlight=/sys/class/backlight/rpi_backlight/bl_power
screen_width=640
screen_height=480
backlight_timeout=10

# Panel haengt hochkant am DPI-Bus, gezeichnet wird quer
fb_rotate=90

# Beim Start direkt in einen Modus: out | in | leer
start_mode=out
touch_swap_xy=1
touch_flip_x=1
touch_flip_y=0

# Ruecksprung in den Auslagern-Modus nach Leerlauf (Minuten, 0 = aus)
idle_reset_minutes=10
